<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AtlasMove App Prototype</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230d302b'/%3E%3Cpath fill='%23b9ef59' d='M16 46 27.5 17h9L48 46h-9.2l-1.7-5.3H26.7L25 46H16Zm13.2-13h5.4l-2.7-8.7-2.7 8.7Z'/%3E%3Ccircle cx='48.5' cy='17' r='3.5' fill='%23f7f8f3'/%3E%3C/svg%3E">
<style>
/* Layout idea: a dark test rail beside two phones running one app. Everything a real user would not see stays in the rail. */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --navy: #102c28; --navy-2: #173d37; --lime: #b9e85e; --green: #137d5a; --green-soft: #e1f2e9;
  --ink: #172522; --muted: #5f6f69; --line: #dfe6e2; --paper: #f3f5f2; --white: #fff;
  --amber: #a5660f; --amber-soft: #fff3d9; --red: #b5442f; --red-soft: #fbe9e5; --wa: #1f8f55;
  --shadow: 0 16px 42px rgba(17,45,41,.1), 0 2px 8px rgba(17,45,41,.05);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid #5c9e22; outline-offset: 2px; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
small { font-size: 12px; }
svg.i { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; }

/* Logo: exact rules from .public-wordmark in app/globals.css */
.wordmark { display: grid; width: 154px; flex: none; }
.wordmark > span { display: flex; align-items: baseline; color: #102c28; font-size: 24px; font-weight: 800; letter-spacing: -.06em; line-height: .9; }
.wordmark b { font-weight: inherit; }
.wordmark b:last-child { color: #6da637; }
.wordmark svg { width: 100%; height: 15px; margin-top: 3px; overflow: visible; color: #78ad3f; }
.wordmark path { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.wordmark circle { fill: #f7f8f4; stroke: currentColor; stroke-width: 2.2; }
.wordmark.inverse > span { color: #fff; }
.wordmark.inverse b:last-child { color: #b9e85e; }
.wordmark.inverse svg { color: #b9e85e; }
.wordmark.inverse circle { fill: #102c28; }
.wordmark.sm { width: 137px; }
.wordmark.sm > span { font-size: 22px; }
.appmark { width: 32px; height: 32px; flex: none; display: block; }

/* Test rail */
.shell { height: 100%; display: grid; grid-template-columns: 318px 1fr; }
.rail { background: var(--navy); color: #fff; display: flex; flex-direction: column; min-height: 0; }
.rail-head { padding: 18px 18px 12px; display: grid; gap: 10px; }
.rail-head p { color: #c8d8d2; font-size: 12.5px; }
.progress { display: grid; gap: 5px; font-size: 12px; color: #d9e9e2; }
.progress div { height: 6px; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--lime); border-radius: inherit; transition: width .3s; }
.rail-btns { display: flex; gap: 8px; }
.rbtn { border: 1px solid rgba(255,255,255,.24); border-radius: 999px; padding: 6px 11px; color: #fff; font-size: 12px; font-weight: 650; }
.rbtn:hover { background: rgba(255,255,255,.1); }
.rbtn.lime { background: var(--lime); border-color: var(--lime); color: var(--navy); }
.rail-scroll { overflow-y: auto; padding: 0 12px 24px; flex: 1; min-height: 0; }
.rsec { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--lime); text-transform: uppercase; padding: 14px 6px 6px; }
.rcard { background: rgba(255,255,255,.07); border-radius: 13px; padding: 10px; display: grid; gap: 8px; font-size: 12.5px; color: #e6efeb; }
.rcard + .rcard { margin-top: 8px; }
.rcard strong { color: #fff; font-size: 12.5px; }
.rcard small { color: #bcd0c9; }
.rbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.rrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rrow > span { flex: 1 1 130px; min-width: 0; }
.feat { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 6px; align-items: center; text-align: left; padding: 6px 8px; border-radius: 10px; color: #e6efeb; font-size: 12.5px; }
.feat:hover { background: rgba(255,255,255,.08); }
.feat.on { background: rgba(185,232,94,.16); color: #fff; }
.feat code { font: 700 11px var(--font); color: #b6c9c2; }
.feat em { font-style: normal; font-size: 10.5px; font-weight: 700; color: #a9beb6; }
.feat em.seen { color: var(--lime); }

/* Stage */
.stage { min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
.stage-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--line); background: #fff; }
.stage-top p { color: var(--muted); font-size: 12.5px; flex: 1; min-width: 180px; }
.seg { display: none; background: var(--paper); border-radius: 999px; padding: 3px; }
.seg button { padding: 6px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
.seg button.on { background: var(--navy); color: #fff; }
.menu-btn { display: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 650; }
.test-pill { background: var(--amber-soft); color: var(--amber); border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 800; letter-spacing: .04em; }
.phones { flex: 1; display: flex; justify-content: center; gap: 28px; padding: 14px 20px 22px; flex-wrap: wrap; align-items: flex-start; }
.device { display: grid; gap: 7px; justify-items: center; }
.device-label { font-size: 12.5px; font-weight: 700; color: var(--navy-2); }
.phone { width: 380px; height: 770px; background: var(--navy); border-radius: 46px; padding: 9px; box-shadow: var(--shadow); }
.screen { position: relative; width: 100%; height: 100%; background: var(--paper); border-radius: 38px; overflow: hidden; display: flex; flex-direction: column; }
.homebar { position: absolute; bottom: 6px; left: 50%; width: 118px; height: 4px; margin-left: -59px; border-radius: 9px; background: rgba(16,44,40,.55); z-index: 9; pointer-events: none; }
.homebar.light { background: rgba(255,255,255,.75); }

/* App chrome */
.sbar { display: flex; justify-content: space-between; align-items: center; padding: 11px 26px 4px; font-size: 12.5px; font-weight: 700; background: #fff; flex: none; }
.sbar.dark { background: var(--navy); color: #fff; }
.sbar.paper { background: var(--paper); }
.sbar span:last-child { display: flex; align-items: center; gap: 5px; }
.ahead { display: flex; align-items: center; gap: 10px; padding: 7px 16px 11px; background: #fff; border-bottom: 1px solid var(--line); min-height: 52px; flex: none; }
.ahead.dark { background: var(--navy); color: #fff; border: 0; }
.ahead h1 { font-size: 18px; letter-spacing: -.025em; flex: 1; min-width: 0; }
.iconbtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--paper); color: var(--navy); position: relative; flex: none; font-size: 15px; }
.ahead.dark .iconbtn { background: rgba(255,255,255,.12); color: #fff; }
.badge { position: absolute; top: -2px; right: -2px; min-width: 17px; height: 17px; border-radius: 99px; background: var(--red); color: #fff; font-size: 10.5px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
.body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.body > * { flex: none; }
.body.enter { animation: enter .22s ease-out; }
@keyframes enter { from { transform: translateX(12px); opacity: .55; } to { transform: none; opacity: 1; } }
.foot { padding: 12px 14px 18px; background: #fff; border-top: 1px solid var(--line); display: grid; gap: 8px; flex: none; }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #fff; border-top: 1px solid var(--line); padding: 7px 8px 18px; flex: none; }
.tabs button { display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 650; color: var(--muted); padding: 4px 0; position: relative; }
.tabs button svg.i { font-size: 17px; }
.tabs button.on { color: var(--green); }
.tabs .badge { right: 22%; top: 0; }
.modebar { display: flex; align-items: center; gap: 8px; padding: 7px 14px; font-size: 12.5px; font-weight: 650; flex: none; width: 100%; text-align: left; background: var(--amber-soft); color: #76490a; }
.modebar.live { background: var(--green-soft); color: #14513d; }
.pdot { width: 8px; height: 8px; border-radius: 50%; background: #1aa576; box-shadow: 0 0 0 4px rgba(26,165,118,.15); flex: none; }
.pdot.off { background: #a5660f; box-shadow: 0 0 0 4px rgba(165,102,15,.15); }

/* Splash */
.splash { position: absolute; inset: 0; background: var(--navy); display: grid; place-items: center; z-index: 20; color: #fff; }
.splash-in { display: grid; justify-items: center; gap: 22px; }
.splash .big { width: 96px; height: 96px; animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; border-radius: 26px; }
.splash .word { display: flex; font-size: 34px; font-weight: 800; letter-spacing: -.06em; animation: rise .5s .35s ease-out both; }
.splash .word b { font-weight: 800; }
.splash .word b + b { color: var(--lime); }
.splash svg.road { width: 220px; height: 22px; overflow: visible; }
.splash svg.road path { fill: none; stroke: var(--lime); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1.1s .6s ease-in-out forwards; }
.splash svg.road circle { fill: var(--navy); stroke: var(--lime); stroke-width: 3; opacity: 0; animation: dot .3s 1.6s ease-out forwards; }
.splash small { color: #bcd0c9; animation: rise .5s .8s ease-out both; }
@keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes dot { from { opacity: 0; transform: scale(.4); transform-origin: center; transform-box: fill-box; } to { opacity: 1; transform: scale(1); transform-origin: center; transform-box: fill-box; } }

/* Components */
.card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 15px; display: grid; gap: 10px; }
.card.navy { background: var(--navy); color: #fff; border: 0; }
.card.navy p { color: #cfe0da; }
.kicker { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--green); text-transform: uppercase; }
.navy .kicker { color: var(--lime); }
h2 { font-size: 21px; line-height: 1.15; letter-spacing: -.03em; }
h3 { font-size: 15px; letter-spacing: -.015em; }
.muted { color: var(--muted); font-size: 13px; }
.pill { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; min-height: 46px; padding: 10px 18px; border-radius: 999px; font-weight: 750; font-size: 14.5px; text-align: center; }
.pill.lime { background: var(--lime); color: var(--navy); }
.pill.lime:hover:not(:disabled) { background: #acdf4b; }
.pill.dark { background: var(--navy-2); color: #fff; }
.pill.dark:hover:not(:disabled) { background: var(--navy); }
.pill.wa { background: var(--wa); color: #fff; }
.pill.wa:hover:not(:disabled) { background: #1a7c49; }
.pill.ghost { background: #fff; border: 1px solid #cdd8d2; color: var(--navy); }
.pill.ghostd { background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; }
.pill.danger { background: #fff; border: 1px solid #e6b9ae; color: var(--red); }
.pill:disabled { background: #e3e8e5; color: #66746f; border: 0; }
.pill.sm { min-height: 36px; padding: 6px 13px; font-size: 13px; width: auto; }
.row { display: flex; align-items: center; gap: 10px; }
.row.top { align-items: flex-start; }
.grow { flex: 1; min-width: 0; }
.list { display: grid; gap: 8px; }
.item { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 15px; padding: 11px 12px; }
button.item:hover { border-color: #a9bdb4; }
.item strong { display: block; font-size: 14px; }
.item small { display: block; color: var(--muted); }
.dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); color: var(--navy); flex: none; font-weight: 800; font-size: 13px; }
.dot.done { background: var(--green); color: #fff; }
.dot.fail { background: var(--red); color: #fff; }
.dot.now { background: var(--lime); color: var(--navy); }
.dot.wa { background: var(--wa); color: #fff; }
.tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 750; background: var(--green-soft); color: #0f6b4c; white-space: nowrap; }
.tag.amber { background: var(--amber-soft); color: var(--amber); }
.tag.red { background: var(--red-soft); color: var(--red); }
.tag.grey { background: #eaeeec; color: #4e5d58; }
.note { display: flex; gap: 9px; padding: 11px 12px; border-radius: 14px; font-size: 13px; background: var(--green-soft); color: #14513d; }
.note.amber { background: var(--amber-soft); color: #76490a; }
.note.red { background: var(--red-soft); color: #8a2f1e; }
.note.grey { background: #eaeeec; color: #3f4e49; }
.field { display: grid; gap: 4px; }
.field > span:not(.phonefield) { font-size: 12.5px; font-weight: 650; color: #33453f; }
.field input, .field select, .field textarea { width: 100%; background: #fff; border: 1px solid #cdd8d2; border-radius: 12px; padding: 10px 11px; min-height: 44px; }
.field textarea { min-height: 72px; resize: vertical; }
.field.err input, .field.err select { border-color: var(--red); }
.field em { font-style: normal; font-size: 12px; color: var(--red); }
.phonefield { display: flex; gap: 8px; align-items: stretch; }
.phonefield b { display: grid; place-items: center; flex: none; min-height: 44px; padding: 0 12px; background: #fff; border: 1px solid #cdd8d2; border-radius: 12px; font-weight: 700; }
.phonefield input { flex: 1; min-width: 0; }
.otp input { text-align: center; font-size: 26px; font-weight: 800; letter-spacing: .32em; min-height: 58px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { border: 1px solid #cdd8d2; background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.facts small { display: block; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.navy .facts small { color: #b9cdc6; }
.facts strong { font-size: 13.5px; overflow-wrap: anywhere; }
.steps { display: flex; gap: 5px; }
.steps i { flex: 1; height: 5px; border-radius: 99px; background: #dbe3df; }
.steps i.on { background: var(--green); }
.check { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 10px 12px; }
.box { width: 24px; height: 24px; border-radius: 8px; border: 2px solid #b7c5be; display: grid; place-items: center; color: #fff; flex: none; font-size: 12px; }
.check.on .box { background: var(--green); border-color: var(--green); }
.switch { width: 44px; height: 26px; border-radius: 99px; background: #cfd9d4; position: relative; flex: none; }
.switch::after { content: ""; position: absolute; width: 22px; height: 22px; top: 2px; left: 2px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch.on { background: var(--green); }
.switch.on::after { left: 20px; }
.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.photo { width: 68px; height: 68px; border-radius: 12px; overflow: hidden; display: grid; place-items: center; }
.photo svg.shot { width: 100%; height: 100%; display: block; }
.photo.add { background: #fff; border: 1.5px dashed #a9bdb4; color: var(--green); font-size: 18px; }
.sig { width: 100%; height: 130px; background: #fff; border: 1.5px dashed #a9bdb4; border-radius: 14px; touch-action: none; display: block; }
.sigview { width: 100%; height: 110px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
.viewfinder { height: 300px; border-radius: 20px; background: radial-gradient(circle at 50% 40%, #2e4a43, #0a1c19); color: #fff; display: grid; place-items: center; position: relative; overflow: hidden; }
.frame { width: 170px; height: 170px; border-radius: 18px; border: 3px solid var(--lime); position: relative; overflow: hidden; }
.frame::after { content: ""; position: absolute; left: 6px; right: 6px; height: 2px; background: var(--lime); box-shadow: 0 0 12px var(--lime); top: 8px; animation: scanline 1.8s ease-in-out infinite alternate; }
@keyframes scanline { to { top: calc(100% - 10px); } }
.viewfinder > span { position: absolute; bottom: 14px; font-size: 13px; color: #e2eee9; text-align: center; left: 12px; right: 12px; }
.camera { background: #0a1c19; color: #fff; }
.camera .viewfinder { height: 330px; }
.shutter { width: 66px; height: 66px; border-radius: 50%; background: #fff; border: 5px solid #8aa59b; justify-self: center; }
.stageflow { display: grid; grid-template-columns: repeat(5, 1fr); position: relative; }
.stageflow::before { content: ""; position: absolute; top: 9px; left: 10%; right: 10%; height: 3px; background: #dfe7e2; border-radius: 9px; }
.stageflow .fill { position: absolute; top: 9px; left: 10%; height: 3px; background: #1b9a70; border-radius: 9px; transition: width .5s; }
.stageflow div { position: relative; display: grid; justify-items: center; gap: 5px; text-align: center; font-size: 10.5px; font-weight: 700; color: #6f7e79; }
.stageflow i { width: 20px; height: 20px; border-radius: 50%; border: 3px solid #fff; background: #dfe7e2; box-shadow: 0 0 0 1px #d3ddd7; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 9px; }
.stageflow .complete i { background: #1b9a70; box-shadow: 0 0 0 1px #1b9a70; }
.stageflow .current i { background: var(--lime); box-shadow: 0 0 0 1px #8dbd3a, 0 0 0 5px rgba(185,232,94,.22); }
.stageflow .complete, .stageflow .current { color: #24483e; }
.map { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: #e8efeb; }
.map.hero { margin: -14px -14px 0; border-radius: 0; border-width: 0 0 1px; }
.map svg { display: block; width: 100%; height: 230px; }
.map footer { background: #fff; padding: 10px 13px; font-size: 12.5px; display: flex; justify-content: space-between; gap: 8px; }
.stars { display: flex; gap: 6px; }
.stars button { width: 42px; height: 42px; font-size: 24px; color: #c9d4cf; }
.stars button.on { color: #d99a1c; }
.bubble { max-width: 82%; padding: 9px 12px; border-radius: 15px; font-size: 13.5px; background: #fff; border: 1px solid var(--line); align-self: flex-start; }
.bubble.me { align-self: flex-end; background: var(--navy-2); color: #fff; border: 0; }
.bubble small { display: block; opacity: .75; font-size: 11px; margin-top: 2px; }
.price { font-size: 38px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.lines { display: grid; gap: 5px; font-size: 13px; }
.lines div { display: flex; justify-content: space-between; gap: 10px; }
.hero-img { margin: -15px -15px 2px; height: 150px; overflow: hidden; border-radius: 20px 20px 0 0; }
.hero-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sheet-wrap { position: absolute; inset: 0; background: rgba(16,44,40,.45); display: flex; align-items: flex-end; z-index: 7; }
.sheet { background: #fff; width: 100%; border-radius: 24px 24px 0 0; padding: 18px 16px 26px; display: grid; gap: 11px; max-height: 90%; overflow-y: auto; }
.sheet.camera { background: #0a1c19; color: #fff; max-height: 100%; }
.toast { position: absolute; left: 10px; right: 10px; top: 42px; z-index: 8; background: var(--navy); color: #fff; border-radius: 16px; padding: 11px 13px; font-size: 13px; box-shadow: 0 14px 34px rgba(16,44,40,.3); display: flex; gap: 9px; text-align: left; width: calc(100% - 20px); animation: rise .2s ease-out; }
.toast svg.i { color: var(--lime); }
.toast strong { display: block; }
.toast.wa { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.toast.wa .dot { width: 30px; height: 30px; }
.busy { position: absolute; inset: 0; z-index: 10; background: rgba(243,245,242,.82); display: grid; place-items: center; align-content: center; gap: 12px; font-weight: 700; color: var(--navy); }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #cdd8d2; border-top-color: var(--green); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.setrow { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 12px 13px; background: #fff; }

    ${a.email?`<button class="pill danger" type="button" data-a="emailRemove">Remove email</button>`:""}`,foot:`<button class="pill lime" type="button" data-a="emailSave">Save and verify</button>`};},

  prefs(){const a=me(),p=a.prefs;return {title:"Notifications",back:true,body:`

    <div class="setgroup">${toggle(p.whatsapp,"prefToggle","whatsapp","WhatsApp","Confirmed, on the way, delivered")}${toggle(p.push,"prefToggle","push","Push notifications","Alerts on this phone")}${a.emailVerified?toggle(p.email,"prefToggle","email","Email",a.email):`<button class="setrow" type="button" data-a="goEmail"><span class="grow"><strong>Email</strong><small>Add and verify an email to turn this on</small></span>${ic("next")}</button>`}</div>`};},

  /* ---------- Driver ---------- */
  home(){const d=S.drv,nx=nextStopIdx(),all=S.stops,a=me(),doneN=all.filter(s=>s.state==="delivered"||s.state==="failed").length;let cta;
    if(d.finished)cta=`<div class="note">${ic("check")}<span>Route finished at ${esc(d.finishedAt)}. GPS is off.</span></div>`;
    else if(!d.collected)cta=`<button class="pill lime" type="button" data-a="go" data-v="scan">${ic("scan")} Scan ${allLabels().length-scanCount()} labels</button>`;
    else if(!d.started)cta=`<button class="pill lime" type="button" data-a="startAsk">${ic("play")} Start Route</button>`;
    else if(nx>=0)cta=`<button class="pill lime" type="button" data-a="openStop" data-v="${nx}">${ic("nav")} Open stop ${nx+1}: ${esc(S.cons[all[nx].ref].postcode)}</button>`;
    else cta=`<button class="pill lime" type="button" data-a="go" data-v="finish">${ic("flag")} Finish route</button>`;
    return {title:`Hello ${a.name.split(" ")[0]}`,mark:true,tabs:"home",body:`
    ${drvMap()}
    <div class="card navy"><div class="row"><div class="grow"><p class="kicker">Wed 11 Nov · London route</p><h2>Bradford to London</h2></div><span class="tag">${d.finished?"Finished":d.started?"Live":"Not started"}</span></div>
      <div class="facts"><div><small>Vehicle</small><strong>Van 1 · TE57 AMV</strong></div><div><small>Progress</small><strong>${doneN} of ${all.length} drops</strong></div><div><small>Distance</small><strong>About 410 miles</strong></div><div><small>Crew</small><strong>${d.crew?esc(d.crew):"Add second person"}</strong></div></div></div>
    ${d.started&&!d.finished?`<div class="card"><div class="row"><span class="pdot ${d.online?"":"off"}"></span><div class="grow"><strong>${d.online?"GPS live":"No signal, GPS paused"}</strong><br><small class="muted" data-live="gps">${d.online?`Last sent ${hhmm()}`:"Customers see your last known time"}</small></div>${d.queue.length?`<span class="tag amber">${d.queue.length} waiting to upload</span>`:`<span class="tag">All uploaded</span>`}</div></div>`:""}
    <div class="list">
      <button class="item" type="button" data-a="go" data-v="vcheck"><span class="dot ${d.vdone?"done":""}">${d.vdone?ic("check"):ic("truck")}</span><span class="grow"><strong>Vehicle check</strong><small>${d.vdone?(d.defect?"Done, defect reported":"Done, no defects"):"Before you leave"}</small></span>${ic("next")}</button>
      <button class="item" type="button" data-a="go" data-v="crew"><span class="dot ${d.crew?"done":""}">${ic("users")}</span><span class="grow"><strong>Crew</strong><small>${d.crew?`With ${esc(d.crew)}`:"Add your second person"}</small></span>${ic("next")}</button>
      <button class="item" type="button" data-a="go" data-v="collect"><span class="dot ${d.collected?"done":"now"}">${d.collected?ic("check"):ic("scan")}</span><span class="grow"><strong>Collection at Bradford hub</strong><small>215 Lumb Lane · BD8 7SG · ${scanCount()} of ${allLabels().length} labels</small></span>${ic("next")}</button>
      ${all.map((s,i)=>{const c=S.cons[s.ref],cls=s.state==="delivered"?"done":s.state==="failed"?"fail":i===nx&&d.started?"now":"";return `<button class="item" type="button" data-a="openStop" data-v="${i}"><span class="dot ${cls}">${s.state==="delivered"?ic("check"):s.state==="failed"?ic("x"):i+1}</span><span class="grow"><strong>${esc(c.postcode)} · ${esc(c.receiver)}</strong><small>${esc(c.summary)} · ${esc(c.window)}</small></span>${s.state==="delivered"?'<span class="tag">Delivered</span>':s.state==="failed"?'<span class="tag red">Failed</span>':s.state==="arrived"?'<span class="tag amber">Arrived</span>':ic("next")}</button>`}).join("")}
    </div>
    ${d.started&&!d.finished&&nx>=0?`<button class="pill ghost" type="button" data-a="go" data-v="finish">${ic("flag")} Finish route</button>`:""}
    <div class="card"><p class="kicker">Next route</p><div class="row"><span class="grow"><strong>Bradford to Glasgow / Edinburgh</strong><br><small class="muted">Sat 14 Nov · 6 drops · TE57 AMV</small></span><span class="tag grey">Published</span></div></div>`,foot:cta};},
  vcheck(){const d=S.drv,items=["Tyres and wheels","Lights and indicators","Brakes and steering","Mirrors and windscreen","Tail lift and load straps","Fuel and fluid levels"],all=items.every(x=>d.vcheck[x]);return {title:"Vehicle check",back:true,body:`<p class="muted">AtlasMove Van 1 · TE57 AMV. Check each item before you leave.</p>
    <button class="pill lime" type="button" data-a="vAllOk">${ic("check")} Everything is OK</button><div class="list">${items.map(x=>`<button class="check ${d.vcheck[x]?"on":""}" type="button" data-a="vItem" data-v="${esc(x)}"><span class="box">${d.vcheck[x]?ic("check"):""}</span>${esc(x)}</button>`).join("")}</div>
    <button class="check ${d.defect?"on":""}" type="button" data-a="vDefect"><span class="box">${d.defect?ic("check"):""}</span>Report a defect to dispatch</button>`,foot:all||d.defect?`<button class="pill dark" type="button" data-a="vDone">Save vehicle check</button>`:""};},
  crew(){const d=S.drv,a=me(),list=["Bilal Ahmed","Sam Turner","Marek Nowak","Daniel Whitaker"].filter(n=>n!==a.name);return {title:"Second crew member",back:true,body:`<p class="muted">Two-person jobs need both people on the record.</p><div class="list">${list.map(n=>`<button class="check ${d.crew===n?"on":""}" type="button" data-a="crewPick" data-v="${n}"><span class="box">${d.crew===n?ic("check"):""}</span>${n}</button>`).join("")}</div>`,};},
  collect(){const d=S.drv,cnt=scanCount(),total=allLabels().length,done=cnt===total;if(!done)tool("Collection",[["Scan all remaining labels","scanAll"]]);return {title:"Collection scan",back:true,body:`
    <div class="card"><div class="row"><div class="grow"><strong>${cnt} of ${total} labels scanned</strong><br><small class="muted">Bradford hub · every piece needs a scan</small></div>${done?'<span class="tag">Complete</span>':'<span class="tag amber">In progress</span>'}</div><div class="steps">${allLabels().map(l=>`<i class="${d.scanned[l]?"on":""}"></i>`).join("")}</div></div>
    ${S.stops.map(s=>{const c=S.cons[s.ref];return `<div class="card"><div class="grow"><h3>${esc(c.summary)}</h3><small class="muted">For ${esc(c.receiver)} · ${esc(c.postcode)}</small></div>
      <div class="list">${c.items.map(l=>`<div class="row"><span class="dot ${d.scanned[l]?"done":""}" style="width:24px;height:24px;font-size:11px">${d.scanned[l]?ic("check"):""}</span><span class="grow" style="font-size:13px">${esc(l)}<br><small class="muted">${esc(c.specs[l])}</small></span></div>`).join("")}</div>
      <div class="row"><small class="muted grow">Condition photos</small><div class="photos">${Array.from({length:d.dmg[c.ref]||0},(_,i)=>`<div class="photo" style="width:42px;height:42px">${shot(i)}</div>`).join("")}<button class="photo add" style="width:42px;height:42px" type="button" data-a="dmgPhoto" data-v="${c.ref}" aria-label="Add condition photo for ${esc(c.summary)}">${ic("cam")}</button></div></div></div>`}).join("")}`,
    foot:done?(d.collected?`<button class="pill dark" type="button" data-a="goHome">Back to route</button>`:`<button class="pill lime" type="button" data-a="collected">Back to route</button>`):`<button class="pill lime" type="button" data-a="go" data-v="scan">${ic("scan")} Scan next label</button>`};},
  scan(){const d=S.drv,next=allLabels().find(l=>!d.scanned[l]);tool("Label scan",[["Point at a wrong label","scanBad"]]);return {title:"Scan label",back:true,body:`
    <div class="viewfinder"><div class="frame"></div><span>Line up the QR label inside the frame</span></div>
    ${d.scanMsg?`<div class="note ${d.scanMsg.bad?"red":""}">${ic(d.scanMsg.bad?"alert":"check")}<span>${esc(d.scanMsg.text)}</span></div>`:""}
    ${next?`<div class="card"><small class="muted">Next label</small><strong>${esc(next)}</strong></div>`:`<div class="note">${ic("check")}<span>All labels scanned.</span></div>`}`,
    foot:`${next?`<button class="pill lime" type="button" data-a="scanOk">${ic("scan")} Scan label</button>`:""}<button class="pill ghost" type="button" data-a="scanMissing">Report a missing piece</button>`};},
  stop(){const d=S.drv,s=S.stops[d.stopIdx],c=S.cons[s.ref],live=d.started&&!d.finished;let foot;
    if(s.state==="delivered"||s.state==="failed")foot=`<button class="pill dark" type="button" data-a="goHome">Back to route</button>`;
    else if(s.state==="arrived")foot=`<button class="pill lime" type="button" data-a="go" data-v="pod">${ic("edit")} Complete delivery</button><button class="pill danger" type="button" data-a="go" data-v="fail">Can't deliver</button>`;
    else foot=`<div class="two"><button class="pill ghost" type="button" data-a="stopSheet" data-v="nav">${ic("nav")} Navigate</button><button class="pill lime" type="button" data-a="arrive" ${live?"":"disabled"}>I've arrived</button></div>${live?"":`<small class="muted" style="text-align:center">Tap Start Route before recording an arrival.</small>`}`;
    if(live&&s.state==="pending")tool("Journey (detected automatically in the real app)",[["Vehicle reaches 15 minutes away","approach"],["Vehicle arrives at the stop","arrive"]]);
    return {title:`Stop ${d.stopIdx+1} of ${S.stops.length}`,back:true,body:`
    <div class="card"><div class="row top"><div class="grow"><p class="kicker">${esc(c.window)} window</p><h2>${esc(c.postcode)}</h2><p class="muted">${esc(c.address)}</p></div>${s.state==="delivered"?'<span class="tag">Delivered</span>':s.state==="failed"?'<span class="tag red">Failed</span>':s.state==="arrived"?`<span class="tag amber">Arrived ${esc(s.arrivedAt)}</span>`:""}</div>
      <div class="facts"><div><small>Receiver</small><strong>${esc(c.receiver)}</strong></div><div><small>Sender</small><strong>${esc(c.sender)}</strong></div></div>
      <button class="pill ghost sm" type="button" data-a="stopSheet" data-v="call" style="justify-self:start">${ic("phone")} Call ${esc(c.receiver)}</button></div>
    <div class="card"><h3>Access notes</h3><p style="font-size:13.5px">${esc(c.notes||"None supplied")}</p>${c.stairs&&c.stairs!=="None"?`<span class="tag amber" style="justify-self:start">Stairs: ${esc(c.stairs)}</span>`:""}${c.parking?`<p class="muted">Parking: ${esc(c.parking)}</p>`:""}${c.accessPhotos?`<div class="photos">${shots(c.accessPhotos)}</div>`:""}</div>
    <div class="card"><h3>Items to deliver</h3><div class="list">${c.items.map(l=>`<div class="row top" style="font-size:13px">${ic("box")}<span>${esc(l)}<br><small class="muted">${esc(c.specs[l])}</small></span></div>`).join("")}</div></div>
    ${s.state==="delivered"?`<div class="note">${ic("check")}<span>Signed by ${esc(d.localPod[s.ref]||c.pod?.name||"receiver")}.</span></div>`:""}`,foot};},
  pod(){const d=S.drv,s=S.stops[d.stopIdx],c=S.cons[s.ref],p=d.pod;
    if(c.owner===P.number)return {title:"Proof of delivery",back:true,body:`<div class="note red">${ic("alert")}<span>This is your own delivery, so you can't sign for it. Ask your second crew member to complete it, or call dispatch.</span></div>`,foot:`<button class="pill ghost" type="button" data-a="back">Back to stop</button>`};
    tool("Proof of delivery",[["Draw a test signature","sigTest"]]);
    return {title:"Proof of delivery",back:true,body:`
    <p class="muted">${esc(c.receiver)} · ${esc(c.postcode)}. Time and location are recorded by the phone.</p>
    <div class="card"><h3>1. Scan each piece</h3><div class="list">${c.items.map(l=>`<div class="row" style="font-size:13px"><span class="dot ${p.scan[l]?"done":""}" style="width:24px;height:24px;font-size:11px">${p.scan[l]?ic("check"):""}</span><span class="grow">${esc(l)}</span></div>`).join("")}</div>${c.items.every(l=>p.scan[l])?"":`<button class="pill dark" type="button" data-a="podScanAll">${ic("scan")} Scan ${c.items.length} piece${c.items.length>1?"s":""}</button>`}</div>
    <div class="card"><h3>2. Who received it?</h3>${field("podName","Receiver's name",{ph:"Full name"})}</div>
    <div class="card"><div class="row"><h3 class="grow">3. Signature</h3><button class="chip" type="button" data-a="sigClear">Clear</button></div><canvas class="sig" data-sig width="620" height="260" aria-label="Sign with your finger or mouse"></canvas><small class="muted">Ask the receiver to sign above.</small></div>
    <div class="card"><h3>4. Delivery photos</h3><div class="photos">${shots(p.photos)}${addPhoto("podPhoto",undefined,"Add delivery photo")}</div><small class="muted">At least one photo is needed.</small></div>
    ${P.err.pod?`<div class="note red" role="alert">${ic("alert")}<span>${esc(P.err.pod)}</span></div>`:""}`,foot:`<button class="pill lime" type="button" data-a="podSubmit">${ic("check")} Submit proof of delivery</button>`};},
  fail(){const d=S.drv,f=d.fail,c=S.cons[S.stops[d.stopIdx].ref],rs=["Receiver not home","Unsafe or no access","Refused by receiver","Item damaged","Wrong address","Vehicle problem"];return {title:"Can't deliver",back:true,body:`
    <p class="muted">${esc(c.receiver)} · ${esc(c.postcode)}. Dispatch and the customer are told straight away.</p>
    <div class="card"><h3>What happened?</h3><div class="chips">${rs.map(r=>`<button class="chip ${f.reason===r?"on":""}" type="button" data-a="failReason" data-v="${esc(r)}">${esc(r)}</button>`).join("")}</div></div>
    <div class="card">${field("failNote","Note for dispatch (optional)",{area:true,ph:"What did you try?"})}<h3>Photo of the location</h3><div class="photos">${shots(f.photos)}${addPhoto("failPhoto",undefined,"Add photo")}</div></div>
    ${P.err.fail?`<div class="note red" role="alert">${ic("alert")}<span>${esc(P.err.fail)}</span></div>`:""}`,foot:`<button class="pill danger" type="button" data-a="failSubmit">Record failed delivery</button>`};},
  finish(){const d=S.drv,left=S.stops.filter(s=>s.state==="pending"||s.state==="arrived"),del=S.stops.filter(s=>s.state==="delivered").length,fl=S.stops.filter(s=>s.state==="failed").length,q=d.queue.length,blocked=left.length>0||q>0;return {title:"Finish route",back:true,body:`
    <div class="card navy"><p class="kicker">Route summary</p><h2>${del} delivered, ${fl} failed</h2><p>${left.length?`${left.length} stop${left.length>1?"s":""} still need an outcome.`:"Every stop has an outcome."}</p></div>
    <div class="list">${S.stops.map((s,i)=>{const c=S.cons[s.ref];return `<div class="item"><span class="dot ${s.state==="delivered"?"done":s.state==="failed"?"fail":""}">${s.state==="delivered"?ic("check"):s.state==="failed"?ic("x"):i+1}</span><span class="grow"><strong>${esc(c.postcode)}</strong><small>${esc(c.receiver)}</small></span><span class="tag ${s.state==="delivered"?"":s.state==="failed"?"red":"amber"}">${s.state==="delivered"?"Delivered":s.state==="failed"?"Failed":"No outcome"}</span></div>`}).join("")}</div>
    ${left.length?`<div class="note amber">${ic("alert")}<span>You can't finish until every stop has an outcome.</span></div>`:""}
    ${q?`<div class="note amber">${ic("off")}<span>${q} action${q>1?"s are":" is"} waiting to upload. Get signal before finishing.</span></div>`:""}`,foot:`<button class="pill lime" type="button" data-a="finishRoute" ${blocked?"disabled":""}>${ic("flag")} ${blocked?"Not ready to finish":"Finish route and stop GPS"}</button>`};},
  messages(){const d=S.drv;tool("Dispatch",[["Dispatch adds an access note","dispatchNote"]]);return {title:"Dispatch",mark:true,tabs:"messages",body:`

  history(){const d=S.drv,past=[["Wed 4 Nov","Bradford to London","4 delivered, 0 failed","5h 42m","402 miles"],["Sun 1 Nov","Bradford to Northampton","4 delivered, 1 failed","4h 18m","268 miles"],["Sat 31 Oct","Bradford to Glasgow / Edinburgh","5 delivered, 0 failed","9h 05m","436 miles"],["Wed 28 Oct","Bradford to London","6 delivered, 0 failed","6h 11m","418 miles"]],today=d.finished?[["Wed 11 Nov","Bradford to London",`${S.stops.filter(s=>s.state==="delivered").length} delivered, ${S.stops.filter(s=>s.state==="failed").length} failed`,`Finished ${d.finishedAt}`,"About 410 miles"]]:[];return {title:"Job history",mark:true,tabs:"history",body:`

  /* ---------- Customer and guest ---------- */
  chome(){const g=P.mode==="guest",a=me(),mine=g?[]:Object.values(S.cons).filter(c=>c.owner===P.number&&c.status!=="delivered");const active=mine.find(c=>S.stops.some(s=>s.ref===c.ref))||mine[0];return {brand:true,tabs:"chome",body:`

    <div class="two"><button class="pill lime" type="button" data-a="startQuote">Instant price</button><button class="pill dark" type="button" data-a="go" data-v="qr">${ic("qr")} Scan to track</button></div>

  q1(){const f=P.form;tool("Quote test data",[["Fill a standard job","qFill","standard"],["Fill an unusual job","qFill","review"]]);TOOLS[P.id].push({title:"Note",text:"Prices use made-up placeholder rates, not AtlasMove's real prices."});

    return {title:"Instant price",back:true,body:`
    <div class="card"><div class="two">${field("from","Collect from",{ph:"BD8 7SG"})}${field("to","Deliver to",{ph:"NN1 4AB"})}</div></div>
    <div class="card"><h3>What's moving?</h3>${chips("item",Object.keys(ITEM_RATE))}<div class="row"><strong class="grow">Pieces</strong><button class="iconbtn" type="button" data-a="pieces" data-v="-1" aria-label="Fewer pieces">−</button><strong style="min-width:24px;text-align:center">${esc(f.pieces)}</strong><button class="iconbtn" type="button" data-a="pieces" data-v="1" aria-label="More pieces">+</button></div></div>
    <button class="setrow" type="button" data-a="moreToggle" style="border:1px solid var(--line);border-radius:14px"><span class="grow"><strong>${P.more?"Fewer options":"More options"}</strong><small>${esc(f.service)} · ${esc(f.weight)} · Stairs: ${esc(f.stairs)}</small></span>${ic("next")}</button>
    ${P.more?`<div class="card"><h3>Heaviest piece</h3>${chips("weight",[...Object.keys(WEIGHT_RATE),"Over 125kg or unsure"])}<h3>Delivery service</h3>${chips("service",["Doorstep or ground floor","Room of choice","Custom handling","Not sure, advise me"])}<h3>Stairs at delivery</h3>${chips("stairs",["None","1 flight","2 or more flights"])}<h3>Delivery window</h3>${chips("window",["Any time","Morning","Afternoon","2-hour slot"])}</div>`:""}
    <div data-price>${priceCard()}</div>`,foot:priceCta()};},
  q5(){const f=P.form,p=priceQuote(f),addr=(key,pc)=>f[key].trim().length>=5?"":`<div class="chips">${addrOptions(pc).map(x=>`<button class="chip" type="button" data-a="setF" data-k="${key}" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;return {title:"Book delivery",back:true,body:`
    <div class="card"><div class="row"><div class="grow"><strong>${esc(normPc(f.from))} to ${esc(normPc(f.to))}</strong><br><small class="muted">${esc(f.pieces)} × ${esc(f.item)}</small></div><strong style="font-size:20px">${p.review?"Price to follow":money(p.total)}</strong></div></div>
    <div class="card"><h3>Which date?</h3><div class="chips">${["Wed 18 Nov","Sat 21 Nov","Sun 22 Nov","Wed 25 Nov"].map(x=>`<button class="chip ${f.date===x?"on":""}" type="button" data-a="setF" data-k="date" data-v="${x}">${x}</button>`).join("")}</div></div>

function testSig(){const c=document.createElement("canvas");c.width=620;c.height=260;const x=c.getContext("2d");x.strokeStyle="#172522";x.lineWidth=5;x.lineCap="round";x.beginPath();x.moveTo(70,170);x.bezierCurveTo(140,30,170,40,190,130);x.bezierCurveTo(205,190,250,150,290,90);x.bezierCurveTo(320,50,340,140,380,150);x.bezierCurveTo(430,160,480,90,560,100);x.stroke();return c.toDataURL();}
function initSig(el){const cv=el.querySelector("[data-sig]");if(!cv)return;const x=cv.getContext("2d");x.lineWidth=5;x.lineCap="round";x.strokeStyle="#172522";
  if(S.drv.pod.sig){const i=new Image();i.onload=()=>x.drawImage(i,0,0);i.src=S.drv.pod.sig;}
  let draw=false;const at=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  cv.addEventListener("pointerdown",e=>{draw=true;cv.setPointerCapture(e.pointerId);const[a,b]=at(e);x.beginPath();x.moveTo(a,b);});
  cv.addEventListener("pointermove",e=>{if(!draw)return;const[a,b]=at(e);x.lineTo(a,b);x.stroke();});
  const end=()=>{if(draw){draw=false;S.drv.pod.sig=cv.toDataURL();}};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);}

function signOutKeep(){P.number=null;P.mode=null;P.stack=[];P.route="login";P.sheet=null;P.err={};P.form.phone="";P.form.code="";}

/* ---------- Fast-forward for feature shortcuts ---------- */
function quickOn(id,num,mode){P=S.phones[id];P.number=num;P.wa=null;P.pending=false;if(mode)enterMode(mode);else routeAfterLogin();if(mode==="driver"&&P.route==="splash")P.route="home";}
function ffDriver(){if(S.phones.a.mode!=="driver")quickOn("a",NUM.driver,"driver");P=S.phones.a;}
function ffScanned(){ffDriver();const d=S.drv;allLabels().forEach(l=>d.scanned[l]=true);S.stops.forEach(s=>{const c=S.cons[s.ref];if(c.status==="assigned"){c.status="collected";addEvent(c.ref,"Collected");}});}
function ffCollected(){ffScanned();if(!S.drv.collected)A.collected();}
function ffStarted(){ffCollected();if(!S.drv.started)A.startRoute();P.toast=null;Object.values(S.phones).forEach(p=>p.toast=null);}
function ffArrive(){ffStarted();let i=nextStopIdx();const d=S.drv;d.stopIdx=i<0?0:i;d.pod={scan:{},sig:null,photos:0};d.fail={reason:null,photos:0};P.form.podName=S.cons[S.stops[d.stopIdx].ref].receiver;if(S.stops[d.stopIdx].state==="pending")A.arrive();}
function dPush(r){ffDriver();P.stack=["home"];P.route=r;P.err={};P.sheet=null;}
function custOn(mode="customer"){if(S.phones.a.number!==NUM.amelia||S.phones.a.mode!==mode){if(mode==="guest"){P=S.phones.a;P.number=null;enterMode("guest");}else quickOn("a",NUM.amelia,"customer");}P=S.phones.a;}
function cPush(r){custOn();P.stack=["chome"];P.route=r;P.err={};P.sheet=null;}
function jump(id){
  const m={
    A1(){A.splashAgain();},A2(){P=S.phones.a;signOut();},A3(){P=S.phones.a;P.number=NUM.fresh;delete S.accounts[NUM.fresh];P.mode=null;P.stack=[];P.route="signup";P.form.name="";},A4(){custOn("guest");tab("chome");},A5(){custOn();tab("settings");},A6(){P=S.phones.a;S.accounts[NUM.both].lastMode=null;P.number=NUM.both;P.mode=null;routeAfterLogin();},A7(){P=S.phones.a;P.number=NUM.off;P.mode=null;routeAfterLogin();},
    D1(){P=S.phones.a;signOut();P.form.phone=fmtNum(NUM.driver);},D2(){ffDriver();tab("home");},D3(){ffDriver();S.drv.stopIdx=2;dPush("stop");},D4(){ffDriver();S.drv.stopIdx=2;dPush("stop");A.stopSheet("nav");},D5(){ffDriver();dPush("collect");},D6(){ffCollected();tab("home");if(!S.drv.started)A.startAsk();},D7(){ffStarted();tab("home");},D8(){ffStarted();const i=nextStopIdx();S.drv.stopIdx=i<0?0:i;dPush("stop");},D9(){ffArrive();dPush("pod");},D10(){ffArrive();dPush("fail");},D11(){ffStarted();if(S.drv.online)A.netToggle();tab("home");},D12(){ffStarted();dPush("finish");},D13(){ffDriver();dPush("collect");},D14(){ffDriver();dPush("vcheck");},D15(){ffDriver();tab("messages");S.drv.unread=0;},D16(){ffDriver();dPush("crew");},D21(){ffDriver();tab("history");},
    C1(){custOn();cPush("q1");},C15(){custOn();A.qFill("standard");cPush("q1");},C2(){custOn();P.bookingId="AMQ-2038";cPush("booking");},C3(){custOn();P.bookingId="AMQ-2039";cPush("pay");},C4(){custOn("guest");P.stack=[];P.route="track";},C5(){ffStarted();custOn();P.trackRef=HERO;cPush("result");},C6(){custOn();if(!me().inbox.length){ffStarted();custOn();}me().unread=0;cPush("inbox");},C7(){custOn();P.trackRef=DONE;cPush("proof");},C8(){custOn();cPush("help");},C9(){custOn();P.trackRef=HERO;A.goChange2();},C10(){custOn();if(!P.form.from)A.qFill("standard");P.more=true;cPush("q1");},C11(){custOn();P.trackRef=HERO;A.goInstr();},C12(){custOn();P.trackRef=MISSED;P.form.date="";cPush("rebook");},C13(){custOn();P.trackRef=DONE;A.goRate();},C14(){custOn();tab("bookings");},C16(){custOn();cPush("chat");},C17(){P=S.phones.a;P.number=NUM.biz;enterMode("customer");P.stack=["chome"];P.route="business";}
  };

function runStory(){S=freshState();FASTSPLASH=true;ffStarted();P=S.phones.a;S.drv.stopIdx=0;dPush("stop");toast(S.phones.a,"Main story","Deliver a stop, then tap Customer in the test panel to see Amelia's tracking update.");}

/* ---------- Splash timing ---------- */

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;
  if(t.dataset.bg&&e.target!==t)return;
  const scr=t.closest("[data-phone]");
  P=S.phones.a;
  if(t.matches(".photo.add")&&!FAST){const v=t.dataset.v;P.sheetClass="camera";P.sheet=`<div class="viewfinder"><span>Hold steady and tap the button</span></div><button class="shutter" type="button" data-a="shutter" data-v="${esc(t.dataset.a)}|${esc(v??"")}" aria-label="Take photo"></button><button class="pill ghostd" type="button" data-a="closeSheet">Cancel</button>`;render();return;}
  const fn=A[t.dataset.a];if(!fn)return;
  fn(t.dataset.v,t);render();
});
document.addEventListener("input",e=>{
  const p=e.target.dataset?.bind;if(!p)return;
  const parts=p.split("."),key=parts[2];P=S.phones[parts[0]];P.form[key]=e.target.value;
  if(key==="code"&&/^\d{6}$/.test(e.target.value.trim())){P.wa=null;A.verify();render();return;}
  if(key==="track"&&/^ATM-\d{6}-[A-F0-9]{12}$/i.test(e.target.value.trim())){A.trackGo();render();return;}
  if(P.route==="q1"&&(key==="from"||key==="to")){const r=document.getElementById("phone-"+P.id),a=r.querySelector("[data-price]"),b=r.querySelector(".foot");if(a)a.innerHTML=priceCard();if(b)b.innerHTML=priceCta();}
});

/* ---------- Clock: moves the vehicle without redrawing forms ---------- */
setInterval(()=>{
  let moved=false;
  Object.values(S.phones).forEach(p=>{const t=p.toast;if(t&&t.until<=Date.now()){p.toast=null;const el=document.querySelector(`#phone-${p.id} .toast:not(.wa)`);if(el)el.remove();}
    if(p.route==="otp"){const b=document.querySelector(`#phone-${p.id} [data-resend]`);if(b){const left=Math.max(0,30-Math.floor((Date.now()-p.otp.sentAt)/1000));b.textContent=left>0?`Resend in ${left}s`:"Resend code";b.disabled=left>0;}}});
  if(S.drv.started&&!S.drv.finished&&S.drv.online&&!document.hidden){
    const s=S.stops[S.leg];if(s&&s.state==="pending"&&S.legProgress<.92){S.legProgress=Math.min(.92,S.legProgress+.006);S.clock+=s.min*.006;moved=true;}else S.clock+=.25;
    document.querySelectorAll('[data-live="gps"]').forEach(el=>el.textContent=`Last sent ${hhmm()}`);
  }
  if(moved){
    document.querySelectorAll("[data-veh]").forEach(v=>{const k=v.dataset.veh,q=lerp(k==="all"?drvFrac():custFrac(Number(k)));v.setAttribute("transform",`translate(${q.x} ${q.y})`);});
    Object.values(S.phones).forEach(p=>{if(p.route!=="result"||!p.trackRef)return;const e=etaFor(p.trackRef);if(!e)return;const r=document.getElementById("phone-"+p.id);const a=r.querySelector('[data-live="eta"]'),m=r.querySelector('[data-live="rem"]'),g=r.querySelector('[data-live="gpsc"]');if(a)a.textContent=hhmm(e.at);if(m)m.textContent=`${e.rem} min remaining`;if(g)g.textContent=`Vehicle updated ${hhmm()}`;});
  }
},1000);

startSplash();
